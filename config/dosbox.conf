# Reference DOSBox / DOSBox Staging conf for local testing.
# 'python dgb.py run' does not read this file; it passes settings directly.
# Use it when driving DOSBox yourself: dosbox -conf config/dosbox.conf

[sdl]
fullscreen = false

[dosbox]
memsize = 16
machine = svga_s3

[cpu]
core = auto
cputype = auto
cpu_cycles = max
cpu_cycles_protected = max
cpu_throttle = false

[dos]
xms = true
ems = true
umb = true
ver = 6.22

[autoexec]
@echo off
REM Set your own mount line below, or use: python dgb.py run
REM mount C /path/to/dos-game-browser/booth
C:
cls
if exist UTILS\ABORT.COM UTILS\ABORT.COM
:loop
BROWSER.COM
goto loop
