; DOS Game Browser runtime config
;
; Lines starting with ';' are comments and do nothing. To turn a setting on,
; DELETE THE LEADING ';' as well as changing the value.
;
; GAMES_ROOT   where your games live, as a DOS path. SCAN writes this for
;              you, so you rarely set it by hand. Default \GAMES.
;
;GAMES_ROOT=\GAMES
;
; ABORT_KEY    the single key that force-exits a stuck game. Default
;              SCRLOCK. Change it if a game needs that key for play.
;              Ctrl+Alt+Backspace always works too, whatever this says.
;
;              Give a name, F1 to F12, or a make-code in hex (46 is the
;              same as SCRLOCK). The names are:
;
;                BKSP CAPSLOCK DEL DOWN END ENTER ESC GRAVE HOME INS LEFT
;                NUMLOCK PGDN PGUP PRTSC RIGHT SCRLOCK SPACE TAB UP
;
;              Remember to delete the ';' below, or nothing changes.
;
;ABORT_KEY=SCRLOCK
