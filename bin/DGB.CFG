; DOS Game Browser runtime config
;
; Everything here is optional. With it all commented out, as shipped, the
; launcher uses the defaults shown.
;
; GAMES_ROOT   where your games live, as a DOS path. SCAN writes this for
;              you, so you rarely set it by hand. Default \GAMES.
;
;GAMES_ROOT=\GAMES
;
; ABORT_KEY    the single key that force-exits a stuck game. F1 to F12, or a
;              raw make-code in hex. Default F12. Change it if a game needs
;              that key for play. Ctrl+Alt+Backspace always works too.
;
;ABORT_KEY=F12
